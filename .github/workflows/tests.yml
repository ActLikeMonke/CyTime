name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Check for legacy frontend markup
        run: |
          if grep -rE '<flux:|dark:|\b(px|py|mx|my|gap)-[0-9]|\bbg-[a-z]+-[0-9]{2,3}' resources/views; then
            echo "Legacy Flux or Tailwind markup found in resources/views." >&2
            exit 1
          fi

      - name: Run CI Checks
        run: composer ci:check
